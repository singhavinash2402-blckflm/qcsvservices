name: Quality

on:
  pull_request:
  workflow_dispatch:

jobs:
  browser-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Check that Playwright is installed
        id: playwright
        run: |
          if [ -d node_modules/@playwright/test ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "Playwright is not installed yet, so browser tests are skipped."
          fi
      - if: steps.playwright.outputs.present == 'true'
        run: npx playwright install --with-deps chromium
      - if: steps.playwright.outputs.present == 'true'
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"
      - if: steps.playwright.outputs.present == 'true'
        run: npm run test:e2e
      - if: always() && steps.playwright.outputs.present == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7

  lighthouse:
    runs-on: ubuntu-latest
    # Advisory for now: scores are reported but do not block a pull request.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"
          # Lets Lighthouse score the SEO category; this build is never deployed.
          NEXT_PUBLIC_ALLOW_INDEXING: "true"
      - run: npx --yes @lhci/cli@0.14.0 autorun --config=lighthouserc.json
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-report
          path: .lighthouseci/
          if-no-files-found: ignore
          retention-days: 7
